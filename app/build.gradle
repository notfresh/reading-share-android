plugins {
    id 'com.android.application'
    // Chaquopy —— app 进程内嵌 CPython,跑 minimal-agent-v2 的 agent 内核
    id 'com.chaquo.python'
}

android {
    namespace 'person.notfresh.readingshare'
    compileSdk 34
    defaultConfig {
        applicationId "person.notfresh.readingshare"
        minSdk 26
        targetSdk 34
        versionCode 77
        versionName "2.4.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Chaquopy 的 Python 解释器是原生组件 —— 必须指定 ABI。
        //
        // **只留 arm64-v8a**:
        //   - Python 解释器 + Chaquopy native 每个 ABI 约 12MB,4 个 ABI = 48MB
        //   - 加上 onnxruntime 每 ABI 15~17MB → 全带的话 APK 137MB
        //   - 只留 arm64-v8a → APK 约 60MB(下载/安装都快得多)
        //
        // 目标设备 = 红米 Turbo 3 / Turbo 5(Snapdragon 8s Gen3/Gen4),
        // 纯 arm64-v8a,没有 32 位设备。
        //
        // ⚠️ **这是个取舍**:这个 APK 只装 arm64-v8a 设备。
        // 要发布给大众用户的话得把 4 个 ABI 都带上(见 git 历史)。
        //
        // 详见 minimal-agent-v2 docs/design-20261029-android-integration.md §2.5
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
        // 2.3.19.6: 生命周期调试日志用 BuildConfig.DEBUG 包一层,release 不输出
        buildConfig true
    }
}

chaquopy {
    defaultConfig {
        // Python 3.11 —— minimal-agent-v2 的 android-agent 分支已验证 3.11 兼容
        // (compileall 通过 + 无 3.12+ 专属语法)
        version = "3.11"
        pip {
            // 手机端依赖锁:openai>=1.40 硬依赖 jiter(Rust 扩展),
            // Chaquopy 无 Android wheel → 装不上,必须锁 1.30。
            // 详见 minimal-agent-v2/android/requirements.txt
            install("openai==1.30.0")
            install("pydantic==1.10.13")
            install("httpx==0.27.2")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.navigation:navigation-fragment:2.7.5'
    implementation 'androidx.navigation:navigation-ui:2.7.5'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.rometools:rome:1.18.0'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.kizitonwose:CalendarView:1.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
} 